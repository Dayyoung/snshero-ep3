name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        env:
          VITE_BASE_PATH: ${{ github.repository == 'Dayyoung/snshero-preview' && '/snshero-preview/' || './' }}
        run: npm run build

      - name: Prepare GitHub Pages subpath for snshero-preview
        if: github.repository == 'Dayyoung/snshero-preview'
        run: |
          rm -f dist/CNAME
          node -e '
            const fs = require("fs");
            const path = require("path");
            const base = "/snshero-preview";
            const roots = ["hs-assets", "stone-assets", "images", "sounds", "data", "assets", "anime-character-sheets"];
            const htmlFiles = ["game.html", "book.html", "webtoon.html", "sns.html", "stone.html", "version.json"];
            const prefixRegex = new RegExp("([\"'\''`(])\\/((" + roots.join("|") + ")\\/|(" + htmlFiles.map(f => f.replace(".", "\\.")).join("|") + "))", "g");
            function walk(dir) {
              for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, ent.name);
                if (ent.isDirectory()) walk(full);
                else if (/\.(html|js|css)$/.test(ent.name)) {
                  const src = fs.readFileSync(full, "utf8");
                  const out = src.replace(prefixRegex, (m, q, rest) => q + base + "/" + rest);
                  if (out !== src) fs.writeFileSync(full, out, "utf8");
                }
              }
            }
            walk("dist");
            console.log("[preview-rewrite] Rewrote root asset paths for " + base);
          '

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
